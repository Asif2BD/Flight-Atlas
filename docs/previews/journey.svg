<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="972" viewBox="0 0 1000 972" role="img" aria-labelledby="cover-title"><title id="cover-title">The journey, in chapters report cover</title><rect width="1000" height="972" fill="#f1f3ed"/><rect x="24" y="24" width="952" height="924" rx="12" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#142f36"><text x="60" y="77" font-size="13" letter-spacing="3" fill="#007c78">FLIGHT ATLAS</text><text x="60" y="146" font-size="47" font-family="Georgia, serif"><tspan x="60" dy="0">The journey, in chapters</tspan></text><g transform="translate(0 -108)"><text x="60" y="292" font-size="17" fill="#516b70">2025-01-01 to 2025-12-31</text><path d="M60 313H940" stroke="#d7e1da"/><text x="60" y="358" font-size="38" font-weight="700">6</text><text x="60" y="384" font-size="12" letter-spacing="2" fill="#516b70">INCLUDED LEGS</text><text x="350" y="358" font-size="38" font-weight="700">47h 10m</text><text x="350" y="384" font-size="12" letter-spacing="2" fill="#516b70">SCHEDULED TIME</text><text x="640" y="358" font-size="38" font-weight="700">6</text><text x="640" y="384" font-size="12" letter-spacing="2" fill="#516b70">AIRPORTS</text><text x="350" y="410" font-size="12" fill="#516b70">6 of 6 legs with known duration</text><svg xmlns="http://www.w3.org/2000/svg" x="40" y="430" width="920" height="460" viewBox="0 0 900 450" role="img" aria-label="Journey timeline in departure-date order"><title>Journey timeline in departure-date order</title><rect width="900" height="450" fill="#edf4ef"/><g font-family="Arial,sans-serif" fill="#142f36"><path d="M61,79V141" stroke="#d7e1da" stroke-width="2" stroke-dasharray="4 4"/><circle cx="61" cy="68" r="16" fill="#007c78"/><text x="61" y="72" text-anchor="middle" font-size="11" fill="#ffffff">01</text><text x="90" y="55" font-size="11" fill="#516b70">2025-01-10</text><text x="90" y="82" font-size="24" font-weight="700">LHR → JFK</text><text x="90" y="103" font-size="11" fill="#516b70">Example Airways · user confirmed</text><path d="M61,166V228" stroke="#d7e1da" stroke-width="2" stroke-dasharray="4 4"/><circle cx="61" cy="155" r="16" fill="#007c78"/><text x="61" y="159" text-anchor="middle" font-size="11" fill="#ffffff">02</text><text x="90" y="142" font-size="11" fill="#516b70">2025-02-10</text><text x="90" y="169" font-size="24" font-weight="700">JFK → SFO</text><text x="90" y="190" font-size="11" fill="#516b70">Example Airways · user confirmed</text><path d="M61,253V315" stroke="#d7e1da" stroke-width="2" stroke-dasharray="4 4"/><circle cx="61" cy="242" r="16" fill="#007c78"/><text x="61" y="246" text-anchor="middle" font-size="11" fill="#ffffff">03</text><text x="90" y="229" font-size="11" fill="#516b70">2025-03-10</text><text x="90" y="256" font-size="24" font-weight="700">SFO → HND</text><text x="90" y="277" font-size="11" fill="#516b70">Example Airways · user confirmed</text><circle cx="61" cy="329" r="16" fill="#007c78"/><text x="61" y="333" text-anchor="middle" font-size="11" fill="#ffffff">04</text><text x="90" y="316" font-size="11" fill="#516b70">2025-04-10</text><text x="90" y="343" font-size="24" font-weight="700">HND → SIN</text><text x="90" y="364" font-size="11" fill="#516b70">Example Airways · user confirmed</text><path d="M506,79V141" stroke="#d7e1da" stroke-width="2" stroke-dasharray="4 4"/><circle cx="506" cy="68" r="16" fill="#007c78"/><text x="506" y="72" text-anchor="middle" font-size="11" fill="#ffffff">05</text><text x="535" y="55" font-size="11" fill="#516b70">2025-05-10</text><text x="535" y="82" font-size="24" font-weight="700">SIN → DXB</text><text x="535" y="103" font-size="11" fill="#516b70">Example Airways · user confirmed</text><circle cx="506" cy="155" r="16" fill="#007c78"/><text x="506" y="159" text-anchor="middle" font-size="11" fill="#ffffff">06</text><text x="535" y="142" font-size="11" fill="#516b70">2025-06-10</text><text x="535" y="169" font-size="24" font-weight="700">DXB → LHR</text><text x="535" y="190" font-size="11" fill="#516b70">Example Airways · user confirmed</text><text x="45" y="420" font-size="11" fill="#516b70">Showing 6 of 6 legs in departure-date order. Same-date order follows evidence; no transfer is implied.</text></g></svg><text x="60" y="932" font-size="15">Evidence-led. Not a complete travel history.</text><text x="60" y="960" font-size="12" fill="#516b70">Scheduled travel time is not actual airborne time. Unknown durations are excluded.</text><text x="60" y="981" font-size="12" fill="#516b70">Every leg by departure date. Same-date order follows evidence; transfers are not inferred.</text><text x="60" y="1016" font-size="11" fill="#516b70">Snapshot: 2025-12-31 · Airport countries include transit stops.</text><a href="https://AR.bd"><text x="940" y="1016" font-size="10" text-anchor="end" fill="#516b70" opacity=".85">Made with Flight Atlas by M Asif Rahman · AR.bd</text></a></g></g></svg>